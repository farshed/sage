[package]
name = "whisper"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.28", features = ["derive"]}
hound = "3.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version ="0.13.2", features = ["coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version ="0.13.2" }